:root {
  --black-950: #0A0A0B;
  --black-900: #111113;
  --black-800: #1A1A1D;
  --graphite-700: #2A2A2E;
  --silver-400: #A9AEB5;
  --silver-200: #D6D9DD;
  --ivory: #F7F3EA;
  --gold-300: #F3D27A;
  --gold-500: #D4A537;
  --gold-600: #B8862B;
  --alert: #FFB4A8;
  --ok: #A8E6B8;
  --tap: 48px;
  --radius: 8px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--black-950);
  color: var(--silver-200);
  font-family: Inter, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
h1, h2, h3 { color: var(--ivory); line-height: 1.2; margin: 0; }
h1 { font-family: "Playfair Display", Georgia, serif; font-weight: 700; font-size: clamp(1.9rem, 6vw, 3rem); }
h2 { font-size: 1.15rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--gold-300); }
main { outline: none; }
:focus-visible { outline: 3px solid var(--gold-300); outline-offset: 2px; }

.wrap { width: min(1080px, calc(100% - 32px)); margin-inline: auto; }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 16px; top: 8px; z-index: 50; background: var(--black-900); padding: 12px; }
.note { color: var(--silver-400); padding-block: 24px; }

/* Header. Call Now stays reachable while scrolling and adds no extra bar. */
.top {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  min-height: 64px;
  padding: 8px max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
  background: var(--black-900);
  border-bottom: 1px solid var(--graphite-700);
}
.brand { display: flex; align-items: center; gap: 8px; flex: 1 1 180px; min-height: var(--tap); min-width: 0; color: var(--ivory); text-decoration: none; font-weight: 600; }
.brand img { width: 40px; height: 40px; flex: none; }
.brand span { min-width: 0; line-height: 1.2; }
.call-now {
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  min-height: var(--tap); min-width: var(--tap); padding: 0 14px;
  background: var(--gold-500); color: var(--black-950);
  border-radius: var(--radius); font-weight: 600; text-decoration: none; white-space: nowrap;
}
.call-number { display: none; margin-left: 6px; }
@media (min-width: 640px) { .call-number { display: inline; } }
@media (max-width: 380px) { .brand span { font-size: 0.9rem; line-height: 1.15; } }
.demo-banner { background: var(--gold-300); color: var(--black-950); font-weight: 600; text-align: center; padding: 8px 16px; }

/* Buttons and inputs */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: var(--tap); padding: 0 16px;
  border-radius: var(--radius); border: 1px solid var(--gold-600);
  background: transparent; color: var(--ivory);
  font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
}
.btn-gold { background: var(--gold-500); color: var(--black-950); border-color: var(--gold-500); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.text-btn { background: none; border: 0; color: var(--gold-300); font: inherit; text-decoration: underline; cursor: pointer; min-height: var(--tap); padding: 0 4px; }
label { display: block; font-weight: 600; color: var(--ivory); }
input, select, textarea {
  display: block; width: 100%; margin-top: 6px;
  min-height: var(--tap); padding: 10px 12px;
  background: var(--black-800); color: var(--ivory);
  border: 1px solid var(--silver-400); border-radius: var(--radius);
  font: inherit; font-size: 16px; font-weight: 400;
}
input[type="checkbox"] { display: inline-block; width: 24px; min-height: 24px; height: 24px; margin: 0 10px 0 0; accent-color: var(--gold-500); flex: none; }
.check { display: flex; align-items: center; min-height: var(--tap); font-weight: 400; color: var(--silver-200); }
.message { padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--alert); color: var(--alert); margin-block: 12px; }
.message.good { border-color: var(--ok); color: var(--ok); }
.message:empty { display: none; }

/* Picker */
.hero { padding-block: 36px 24px; }
.hero p { margin-top: 12px; max-width: 42rem; color: var(--silver-200); font-size: 1.1rem; }
.picker { list-style: none; margin: 0; padding: 0 0 8px; display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; }
.picker > li { flex: 0 0 min(240px, 78vw); scroll-snap-align: start; }
@media (min-width: 900px) {
  .picker { flex-wrap: wrap; overflow: visible; }
  .picker > li { flex: 1 1 200px; }
}
.pick {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: 80px; padding: 16px 18px;
  background: var(--black-800); border: 1px solid var(--gold-600); border-radius: var(--radius);
  color: var(--ivory); text-decoration: none; font-size: 1.15rem; font-weight: 600;
}
.pick:hover { border-color: var(--gold-300); }
.pick span:last-child { color: var(--gold-300); flex: none; }
.team-link { padding-block: 16px 8px; }

/* Signature move: the path a lead travels lights up one stage at a time as you scroll. */
.journey { padding-block: 48px 72px; }
.journey > p { color: var(--silver-400); margin-top: 8px; }
.steps { list-style: none; margin: 24px 0 0; padding: 0; border-left: 2px solid var(--graphite-700); }
.step { position: relative; padding: 18px 0 18px 22px; opacity: 0.35; transition: opacity 0.5s ease; }
.step::before { content: ""; position: absolute; left: -8px; top: 26px; width: 14px; height: 14px; border-radius: 50%; background: var(--graphite-700); transition: background 0.5s ease; }
.step.on { opacity: 1; }
.step.on::before { background: var(--gold-500); }
.step p { color: var(--silver-200); }
@media (prefers-reduced-motion: reduce) { .step, .step::before { transition: none; } }

/* Sign in */
.signin { max-width: 26rem; padding-block: 32px 48px; }
.signin form { margin-top: 20px; display: grid; gap: 14px; }

/* Dashboard. This is the working tool: no animation anywhere below here. */
.page { padding-block: 20px 56px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 16px; }
.page-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fetched { color: var(--silver-400); font-size: 0.9rem; margin-top: 4px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 20px 0 0; }
@media (min-width: 640px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 960px) { .stats { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.stats.money { margin-top: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 960px) { .stats.money { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stat { background: var(--black-800); border: 1px solid var(--graphite-700); border-radius: var(--radius); padding: 12px 14px; }
.stat dt { color: var(--silver-400); font-size: 0.9rem; }
.stat dd { margin: 2px 0 0; color: var(--ivory); font-size: 1.5rem; font-weight: 600; }
.stat dd.unknown { color: var(--silver-400); font-size: 1.15rem; padding-block: 3px; }
.stat small { display: block; color: var(--silver-400); font-size: 0.8rem; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
.chip { min-height: var(--tap); padding: 0 14px; border-radius: 24px; border: 1px solid var(--graphite-700); background: transparent; color: var(--silver-200); font: inherit; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--gold-500); border-color: var(--gold-500); color: var(--black-950); font-weight: 600; }
.search-row { display: grid; gap: 10px; margin-top: 12px; }
@media (min-width: 640px) { .search-row { grid-template-columns: 2fr 1fr; } }
.leads { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
.lead { display: flex; align-items: stretch; background: var(--black-800); border: 1px solid var(--graphite-700); border-radius: var(--radius); }
.lead-main { flex: 1; min-width: 0; padding: 12px 14px; color: var(--silver-200); text-decoration: none; }
.lead-main:hover .lead-name { text-decoration: underline; }
.lead-name { display: block; color: var(--ivory); font-weight: 600; font-size: 1.05rem; }
.lead-meta { display: block; font-size: 0.9rem; color: var(--silver-400); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.pill { font-size: 0.8rem; padding: 2px 10px; border-radius: 12px; border: 1px solid var(--graphite-700); color: var(--silver-200); }
.pill.todo { border-color: var(--gold-500); color: var(--gold-300); }
.pill.test { border-color: var(--alert); color: var(--alert); }
.lead-call { flex: none; display: flex; align-items: center; justify-content: center; width: 72px; min-height: var(--tap); border-left: 1px solid var(--graphite-700); color: var(--gold-300); font-weight: 600; text-decoration: none; }
.empty { padding: 24px 16px; text-align: center; color: var(--silver-400); border: 1px dashed var(--graphite-700); border-radius: var(--radius); margin-top: 16px; }

/* One lead */
.crumb { display: inline-flex; align-items: center; min-height: var(--tap); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.detail { display: grid; gap: 16px; margin-top: 20px; }
@media (min-width: 900px) { .detail { grid-template-columns: 1fr 1fr; align-items: start; } }
.detail-side { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--black-900); border: 1px solid var(--graphite-700); border-radius: var(--radius); padding: 16px; }
.outcome-form { display: grid; gap: 14px; margin-top: 12px; }
.pair { display: grid; gap: 14px; }
@media (min-width: 480px) { .pair { grid-template-columns: 1fr 1fr; } }
.save-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.facts { margin: 12px 0 0; display: grid; gap: 10px; }
.facts div { display: grid; gap: 0; }
.facts dt { color: var(--silver-400); font-size: 0.85rem; }
.facts dd { margin: 0; color: var(--ivory); }
.facts dd.blank { color: var(--silver-400); }
.transcript { white-space: pre-wrap; margin-top: 12px; }

/* Team overview */
.team-grid { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 12px; }
.team-card { background: var(--black-900); border: 1px solid var(--graphite-700); border-radius: var(--radius); padding: 16px; }
.team-card h2 a { color: var(--ivory); }

/* Ad numbers. Static on purpose, like the rest of the working tool. */
.ads-panel, .site-panel { margin-top: 20px; padding: 16px; background: var(--black-900); border: 1px solid var(--graphite-700); border-radius: var(--radius); }
.ads-panel .filters, .site-panel .filters { margin-top: 12px; }
.site-contact p { margin: 4px 0; }
.sync-line { display: flex; align-items: center; gap: 8px; }
.sync-mark {
  display: inline-block; width: 14px; height: 14px; flex: none;
  border: 2px solid var(--gold-500); border-right-color: transparent; border-radius: 50%;
  vertical-align: -2px; animation: sync-spin 0.8s linear infinite;
}
@media (prefers-reduced-motion: reduce) {
  .sync-mark { animation: none; border-right-color: var(--gold-500); }
}
@keyframes sync-spin { to { transform: rotate(360deg); } }
.board-title { margin-top: 18px; font-size: 1rem; font-weight: 600; }
.board-title + .stats { margin-top: 8px; }
.section-title { margin-top: 28px; }
.section-title + .stats { margin-top: 10px; }
.ad-list { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.ad-card { background: var(--black-800); border: 1px solid var(--graphite-700); border-radius: var(--radius); padding: 12px 14px; }
.ad-card h3 { font-size: 1rem; font-weight: 600; }
.ad-facts { margin: 8px 0 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; }
@media (min-width: 640px) { .ad-facts { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 960px) { .ad-facts { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
.ad-facts dt { color: var(--silver-400); font-size: 0.8rem; }
.ad-facts dd { margin: 0; color: var(--ivory); font-weight: 600; }
.team-link a { display: inline-flex; align-items: center; min-height: var(--tap); }
.add-page { max-width: 34rem; }
.lead { flex-wrap: wrap; }
.lead-contacted { flex: none; display: flex; align-items: center; gap: 6px; min-height: var(--tap); padding: 0 12px; border-left: 1px solid var(--graphite-700); font-weight: 600; color: var(--silver-200); cursor: pointer; }
.lead-contacted input { margin: 0; }
.lead > .message { flex-basis: 100%; margin: 0 12px 12px; }
.alerts { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.alerts .message { margin: 0; }

/* ===== Premium skin, 2026-11-11. Depth instead of flat boxes: layered shadows, a top light edge,
   a gold rim on the things that matter. All depth is static. The only motion stays the picker's journey
   section above; nothing moves between a person and a save. ===== */
:root {
  --surface-1: linear-gradient(180deg, #1C1C20 0%, #141417 100%);
  --surface-2: linear-gradient(180deg, #212126 0%, #17171B 100%);
  --edge: inset 0 1px 0 rgba(255,255,255,0.06), inset 0 -1px 0 rgba(0,0,0,0.5);
  --lift: 0 1px 1px rgba(0,0,0,0.4), 0 6px 14px -6px rgba(0,0,0,0.7), 0 18px 36px -18px rgba(0,0,0,0.8);
  --lift-gold: 0 0 0 1px rgba(212,165,55,0.35), 0 10px 28px -10px rgba(212,165,55,0.35), 0 22px 44px -22px rgba(0,0,0,0.9);
  --radius: 14px;
}
body {
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(212,165,55,0.10), transparent 60%),
    radial-gradient(900px 500px at -10% 10%, rgba(169,174,181,0.06), transparent 60%),
    var(--black-950);
  background-attachment: fixed;
  font-feature-settings: "tnum" 1, "ss01" 1;
}
.top {
  background: rgba(14,14,16,0.82);
  -webkit-backdrop-filter: saturate(140%) blur(14px); backdrop-filter: saturate(140%) blur(14px);
  border-bottom: 1px solid rgba(212,165,55,0.18);
  box-shadow: 0 8px 24px -16px rgba(0,0,0,0.9);
}
.brand img { filter: drop-shadow(0 4px 10px rgba(212,165,55,0.35)); }
.call-now, .btn-gold {
  background: linear-gradient(180deg, var(--gold-300) 0%, var(--gold-500) 55%, var(--gold-600) 100%);
  border: 0; color: #140F02;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), inset 0 -2px 0 rgba(0,0,0,0.18), 0 6px 16px -6px rgba(212,165,55,0.6);
}
.btn { border-radius: 12px; border-color: rgba(212,165,55,0.45); background: var(--surface-2); box-shadow: var(--edge), var(--lift); }
.btn:hover { border-color: var(--gold-300); }
.btn:active, .call-now:active { transform: translateY(1px); }
input, select, textarea {
  background: #0F0F12; border: 1px solid #34343A; border-radius: 12px;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
}
input:focus, select:focus, textarea:focus { border-color: var(--gold-500); outline: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.6), 0 0 0 3px rgba(212,165,55,0.25); }

/* Panels, stats and cards all sit on one depth system */
.panel, .ads-panel, .site-panel, .team-card, .stat, .lead, .ad-card, .pick {
  background: var(--surface-1);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: var(--radius);
  box-shadow: var(--edge), var(--lift);
}
.ads-panel, .site-panel, .panel { padding: 20px; }
.ads-panel h2, .site-panel h2, .panel h2, .team-card h2 { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; letter-spacing: 0.01em; }
.ads-panel h2::before, .site-panel h2::before, .panel h2::before, .team-card h2::before {
  content: ""; width: 26px; height: 26px; flex: none; border-radius: 8px;
  background: radial-gradient(circle at 30% 25%, #FFF1C2 0%, var(--gold-300) 25%, var(--gold-500) 60%, #7A5615 100%);
  box-shadow: inset 0 -3px 5px rgba(0,0,0,0.35), 0 4px 10px -3px rgba(212,165,55,0.55);
  transform: perspective(60px) rotateX(12deg) rotateY(-12deg);
}

/* The number tiles: the most important reading on the page, so they get the most depth */
.stats { gap: 12px; }
.stat { position: relative; overflow: hidden; padding: 14px 16px 16px; }
.stat::after { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: linear-gradient(90deg, transparent, rgba(243,210,122,0.55), transparent); }
.stat dt { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.72rem; font-weight: 600; }
.stat dd { font-size: 1.85rem; line-height: 1.15; margin-top: 6px; letter-spacing: -0.01em; }
.stats.money .stat { box-shadow: var(--edge), var(--lift-gold); }
.stats.money .stat dd { background: linear-gradient(180deg, #FFF3CF, var(--gold-300) 60%, var(--gold-500)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stats.money .stat dd.unknown { background: none; color: var(--silver-400); }

/* Leads: easy scan, one row per person */
.leads { gap: 10px; }
.lead { overflow: hidden; }
.lead-main { padding: 14px 16px; }
.lead-name { font-size: 1.1rem; }
.lead-call, .lead-contacted { border-left-color: rgba(255,255,255,0.06); }
.lead-call { background: linear-gradient(180deg, rgba(212,165,55,0.14), rgba(212,165,55,0.04)); }
.pill { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.10); padding: 3px 10px; font-weight: 600; }
.pill.todo { background: rgba(212,165,55,0.12); }
.chip { background: var(--surface-2); border-color: rgba(255,255,255,0.08); box-shadow: var(--edge); }
.chip[aria-pressed="true"] { background: linear-gradient(180deg, var(--gold-300), var(--gold-500)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 6px 14px -6px rgba(212,165,55,0.55); }

/* Picker: 3D tiles a prospect sees first */
.hero h1 { background: linear-gradient(180deg, #FFFDF6, var(--ivory) 55%, #CDBF9C); -webkit-background-clip: text; background-clip: text; color: transparent; }
.pick { min-height: 96px; padding: 18px 20px; border-color: rgba(212,165,55,0.28); }
.pick::before {
  content: ""; width: 40px; height: 40px; flex: none; margin-right: 4px; border-radius: 12px;
  background: radial-gradient(circle at 30% 25%, #FFF1C2 0%, var(--gold-300) 25%, var(--gold-500) 60%, #6F4E12 100%);
  box-shadow: inset 0 -4px 7px rgba(0,0,0,0.35), 0 8px 16px -6px rgba(212,165,55,0.6);
  transform: perspective(80px) rotateX(14deg) rotateY(-14deg);
}
.pick span:first-of-type { flex: 1; }
.pick:hover { border-color: var(--gold-300); box-shadow: var(--edge), var(--lift-gold); }
.ad-facts dd { font-size: 1.05rem; }
.message { border-radius: 12px; background: rgba(255,180,168,0.06); }
.message.good { background: rgba(168,230,184,0.06); }
.empty { border-radius: var(--radius); background: rgba(255,255,255,0.02); }
.demo-banner { background: linear-gradient(90deg, var(--gold-500), var(--gold-300), var(--gold-500)); }

/* ---------- 2026-11-11: live, speed to lead, money chain, owner board ---------- */

/* Each kind of panel gets its own gold object, so sections are told apart at a glance. */
.site-panel h2::before { border-radius: 50%; transform: none; background: radial-gradient(circle at 32% 28%, #FFF6D6 0%, var(--gold-300) 22%, var(--gold-500) 58%, #5E420F 100%); }
.ads-panel h2::before { border-radius: 7px; transform: perspective(60px) rotateX(18deg) rotateY(-22deg); }
.customers-panel h2::before { border-radius: 50% 50% 12px 12px; transform: none; }
.next-up h2::before, .team-card h2::before { display: none; }

/* Live: a still dot, never a pulse. This is the working tool. */
.live { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; padding: 4px 12px 4px 10px; border-radius: 999px;
  background: rgba(168,230,184,0.07); border: 1px solid rgba(168,230,184,0.25); color: var(--ok); font-size: 0.85rem; font-weight: 600; }
.live-dot { width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #E9FFF0, var(--ok) 55%, #3E8A57);
  box-shadow: 0 0 0 3px rgba(168,230,184,0.15), 0 0 10px rgba(168,230,184,0.55); flex: none; }
.live-when { color: var(--silver-400); font-weight: 400; }

/* Speed to lead */
.pill.wait { font-variant-numeric: tabular-nums; }
.pill.wait.fresh { border-color: rgba(168,230,184,0.55); color: var(--ok); background: rgba(168,230,184,0.08); }
.pill.wait.warm { border-color: var(--gold-500); color: var(--gold-300); background: rgba(212,165,55,0.12); }
.pill.wait.late { border-color: var(--alert); color: var(--alert); background: rgba(255,180,168,0.08); }
.next-up {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 20px;
  margin-top: 20px; padding: 18px 20px 18px 76px; position: relative;
  border-radius: var(--radius); border: 1px solid rgba(212,165,55,0.45);
  background: linear-gradient(135deg, rgba(212,165,55,0.16), rgba(212,165,55,0.03) 55%), var(--surface-1);
  box-shadow: var(--edge), var(--lift-gold);
}
.next-up::before {
  content: ""; position: absolute; left: 20px; top: 50%; width: 40px; height: 40px; margin-top: -20px; border-radius: 12px;
  background: radial-gradient(circle at 30% 25%, #FFF1C2 0%, var(--gold-300) 25%, var(--gold-500) 60%, #6F4E12 100%);
  box-shadow: inset 0 -4px 7px rgba(0,0,0,0.35), 0 8px 16px -6px rgba(212,165,55,0.6);
  transform: perspective(80px) rotateX(14deg) rotateY(-14deg);
}
.next-up.clear { border-color: rgba(168,230,184,0.35); background: linear-gradient(135deg, rgba(168,230,184,0.10), transparent 55%), var(--surface-1); box-shadow: var(--edge), var(--lift); }
.next-up.clear::before { background: radial-gradient(circle at 30% 25%, #F1FFF5 0%, var(--ok) 40%, #3E8A57 100%); box-shadow: inset 0 -4px 7px rgba(0,0,0,0.3), 0 8px 16px -6px rgba(168,230,184,0.5); }
.next-copy { min-width: 0; flex: 1 1 260px; }
.next-copy h2 { font-size: 1.2rem; }
.next-copy p { margin-top: 4px; color: var(--silver-200); }
.next-copy strong { color: var(--ivory); }
.next-actions { display: flex; flex-wrap: wrap; gap: 8px; }
@media (max-width: 420px) { .next-up { padding-left: 20px; padding-top: 72px; } .next-up::before { top: 18px; margin-top: 0; } }

/* Funnel: numbered steps, read left to right (or top to bottom on a phone). */
.stats.funnel { counter-reset: step; }
.stats.funnel .stat { counter-increment: step; padding-top: 30px; }
.stats.funnel .stat::before {
  content: counter(step); position: absolute; top: 9px; right: 10px; width: 20px; height: 20px; border-radius: 50%;
  display: grid; place-items: center; font-size: 0.7rem; font-weight: 600; color: #140F02;
  background: radial-gradient(circle at 35% 30%, #FFF1C2, var(--gold-500) 70%); box-shadow: 0 2px 6px rgba(0,0,0,0.5);
}
.rate { display: block; margin-top: 4px; font-size: 0.8rem; font-weight: 600; color: var(--gold-300); }
.customers-panel { margin-top: 20px; }
.customers-panel .stats { margin-top: 16px; }

/* Money chain: dollars in, customers, dollars back */
.chain-wrap { margin-top: 14px; }
.chain { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 640px) { .chain { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .chain { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 18px; } }
.chain-link {
  position: relative; display: flex; flex-direction: column; gap: 4px; padding: 14px 14px 16px;
  border-radius: 12px; background: var(--surface-2); border: 1px solid rgba(255,255,255,0.07); box-shadow: var(--edge), var(--lift);
}
.chain-link.meta { border-top: 2px solid rgba(169,174,181,0.6); }
.chain-link.records { border-top: 2px solid var(--gold-500); }
.chain-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; color: var(--silver-400); }
.chain-value { font-size: 1.45rem; color: var(--ivory); font-variant-numeric: tabular-nums; }
.chain-link.unknown .chain-value { font-size: 1.05rem; color: var(--silver-400); padding-block: 4px; }
@media (min-width: 1000px) {
  .chain-link + .chain-link::before {
    content: ""; position: absolute; left: -15px; top: 50%; width: 10px; height: 10px; margin-top: -5px;
    border-top: 2px solid var(--gold-500); border-right: 2px solid var(--gold-500); transform: rotate(45deg); opacity: 0.8;
  }
}
.chain-verdict { margin-top: 12px; font-weight: 600; color: var(--gold-300); }

/* Owner board: every business at once */
.owner-board { margin-top: 20px; padding: 20px; border-radius: var(--radius); border: 1px solid rgba(212,165,55,0.3);
  background: linear-gradient(160deg, rgba(212,165,55,0.10), transparent 45%), var(--surface-1); box-shadow: var(--edge), var(--lift-gold); }
.owner-board .stats { margin-top: 0; }
@media (min-width: 960px) { .stats.owner-totals { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.owner-board .note { padding-block: 12px 0; }
.team-grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.team-card { display: flex; flex-direction: column; gap: 12px; padding: 18px; }
.team-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.team-card h2 { font-size: 1.15rem; }
.team-card h2 a { text-decoration: none; }
.team-card h2 a:hover { text-decoration: underline; }
.status { flex: none; font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); color: var(--silver-200); background: rgba(255,255,255,0.03); }
.status.good { color: var(--ok); border-color: rgba(168,230,184,0.4); background: rgba(168,230,184,0.07); }
.status.bad { color: var(--alert); border-color: rgba(255,180,168,0.5); background: rgba(255,180,168,0.07); }
.stats.mini { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 0; }
.stats.mini .stat { padding: 10px 12px 12px; }
.stats.mini .stat dd { font-size: 1.3rem; }
.stats.mini .stat dd.unknown { font-size: 0.95rem; }
.team-card .note { padding-block: 0; }
.open-business { align-self: flex-start; margin-top: auto; }
.setup { border-top: 1px solid rgba(255,255,255,0.06); padding-top: 4px; }
.setup summary { display: flex; align-items: center; gap: 10px; min-height: var(--tap); cursor: pointer; color: var(--silver-200); font-weight: 600; font-size: 0.9rem; }
.setup-meter { display: inline-flex; gap: 3px; }
.setup-meter .seg { width: 14px; height: 10px; border-radius: 3px; background: #2A2A2E; box-shadow: inset 0 1px 2px rgba(0,0,0,0.6); }
.setup-meter .seg.on { background: linear-gradient(180deg, var(--gold-300), var(--gold-600)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 2px 5px -1px rgba(212,165,55,0.6); }
.setup-list { list-style: none; margin: 4px 0 8px; padding: 0; display: grid; gap: 6px; }
.setup-list li { display: flex; justify-content: space-between; gap: 10px; font-size: 0.9rem; padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,0.02); }
.setup-list li.on strong { color: var(--ok); }
.setup-list li.off strong { color: var(--silver-400); }

/* Phone fit. At 320px a tile is about 120px wide, so big numbers scale with the screen and fit whole.
   No nowrap: if a huge amount still does not fit, it wraps, because a clipped number would be wrong. */
.stat dd { font-size: clamp(1.25rem, 5vw, 1.85rem); }
.chain-value { font-size: clamp(1.1rem, 4.6vw, 1.45rem); }
.stats.owner-totals .stat dd { font-size: clamp(1.25rem, 2.2vw, 1.6rem); }
@media (max-width: 420px) {
  .ads-panel, .site-panel, .panel, .owner-board { padding: 14px; }
  .team-card { padding: 14px; }
}
.team-card { container-type: inline-size; }
.stats.mini { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stats.mini .stat dd { font-size: 1.15rem; }
@container (min-width: 380px) { .stats.mini { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* ---------- 2026-11-11: where people clicked ---------- */
.stats.taps-more { margin-top: 8px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stats.depth { margin-top: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 640px) { .stats.depth { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 420px) { .stats.taps-more .stat dd { font-size: 1.1rem; } }
.taps { margin-top: 10px; }
.tap-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: tap; }
.tap-row {
  --share: 0%;
  position: relative; overflow: hidden; counter-increment: tap;
  display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; grid-template-areas: "rank name count" "rank where count";
  align-items: center; column-gap: 12px; padding: 12px 14px 14px;
  border-radius: 12px; background: var(--surface-2); border: 1px solid rgba(255,255,255,0.06); box-shadow: var(--edge), var(--lift);
}
.tap-row::before {
  content: counter(tap); grid-area: rank; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  font-size: 0.75rem; font-weight: 600; color: #140F02;
  background: radial-gradient(circle at 35% 30%, #FFF1C2, var(--gold-500) 70%); box-shadow: 0 2px 6px rgba(0,0,0,0.5);
}
.tap-name { grid-area: name; color: var(--ivory); font-weight: 600; min-width: 0; }
.tap-where { grid-area: where; color: var(--silver-400); font-size: 0.85rem; min-width: 0; }
.tap-count { grid-area: count; color: var(--gold-300); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.tap-bar { position: absolute; left: 0; bottom: 0; height: 3px; width: var(--share); border-radius: 0 3px 3px 0;
  background: linear-gradient(90deg, var(--gold-600), var(--gold-300)); box-shadow: 0 0 8px rgba(212,165,55,0.45); }
.tap-row.kind-call .tap-bar { background: linear-gradient(90deg, #3E8A57, var(--ok)); }
.tap-row.kind-outbound .tap-bar { background: linear-gradient(90deg, #5d6168, var(--silver-200)); }
.taps-all { margin-top: 10px; }
.taps-all summary { display: flex; align-items: center; min-height: var(--tap); cursor: pointer; color: var(--gold-300); font-weight: 600; }
.taps-all .tap-list { margin-top: 8px; }

</style>

<script type="module">
// Shared rules for Forever Gold CRM. The browser and the Worker both import this file,
// so a lead is counted, merged and validated the same way everywhere.
// A blank cell means "not recorded". It is never treated as zero or as "no".

// Stable field names, and the sheet headers each one reads from.
// Headers are matched after trimming and lowercasing because the live sheet has
// headers with trailing spaces ("Timestamp ", "Contact Name ").
const FIELD_HEADERS = {
  timestamp: ['Timestamp'],
  name: ['Contact Name'],
  phone: ['Phone'],
  project: ['Surface Type', 'Project', 'Vehicle and Need'],
  preferredDay: ['Preferred Day'],
  appointmentDate: ['Appointment Date'],
  appointmentTime: ['Appointment Time'],
  conversationId: ['Conversation ID'],
  transcript: ['Transcript'],
  leadId: ['Lead ID'],
  source: ['Source'],
  website: ['Website'],
  email: ['Email'],
  qa: ['QA'],
  contactStatus: ['Contact Status'],
  bookingStatus: ['Booking Status'],
  jobStatus: ['Job Status'],
  paymentStatus: ['Payment Status'],
  collectedRevenue: ['Collected Revenue'],
  potentialMoney: ['Potential Money'],
  directJobCosts: ['Direct Job Costs'],
  otherCosts: ['Other Attributable Costs'],
  outcomeNotes: ['Outcome Notes'],
  crmUpdatedAt: ['CRM Updated At'],
};

const STATUS_OPTIONS = {
  contactStatus: ['Attempted', 'Reached', 'Qualified', 'Not a fit', 'Bad number'],
  bookingStatus: ['Not booked', 'Booked', 'Rescheduled', 'Canceled'],
  jobStatus: ['Pending', 'In progress', 'Completed', 'Canceled', 'No-show'],
  paymentStatus: ['Unpaid', 'Deposit paid', 'Paid in full', 'Refunded'],
};
const MONEY_FIELDS = ['potentialMoney', 'collectedRevenue', 'directJobCosts', 'otherCosts'];
const OUTCOME_FIELDS = [...Object.keys(STATUS_OPTIONS), ...MONEY_FIELDS, 'outcomeNotes'];
// Potential Money was added later, so a tab without it still reads. Saving it there is refused, not misplaced.
const REQUIRED_FIELDS = ['timestamp', 'name', 'phone', ...OUTCOME_FIELDS.filter((field) => field !== 'potentialMoney'), 'crmUpdatedAt'];

const NOTES_MAX = 2000;
const MERGE_WINDOW_MS = 10 * 60 * 1000;

const headerKey = (value) => String(value ?? '').trim().replace(/\s+/g, ' ').toLowerCase();
const cell = (value) => String(value ?? '').trim();

function mapHeaders(headerRow = []) {
  const positions = new Map();
  headerRow.forEach((header, index) => {
    const key = headerKey(header);
    if (key && !positions.has(key)) positions.set(key, index);
  });
  const columns = {};
  for (const [field, names] of Object.entries(FIELD_HEADERS)) {
    for (const name of names) {
      const at = positions.get(headerKey(name));
      if (at !== undefined) {
        columns[field] = at;
        break;
      }
    }
  }
  const missing = REQUIRED_FIELDS.filter((field) => columns[field] === undefined);
  return { columns, missing };
}

function digitsOnly(phone) {
  const digits = cell(phone).replace(/\D/g, '');
  return digits.length === 11 && digits.startsWith('1') ? digits.slice(1) : digits;
}

function toMoney(value) {
  const text = cell(value).replace(/[$,\s]/g, '');
  if (!text || !/^-?\d+(\.\d+)?$/.test(text)) return null;
  return Number(text);
}

function parseTime(value) {
  const text = cell(value);
  if (!text) return null;
  const ms = Date.parse(text);
  return Number.isNaN(ms) ? null : ms;
}

function isTestRecord(fields) {
  if (/^(yes|y|true|1|test|qa)$/i.test(cell(fields.qa))) return true;
  const name = cell(fields.name);
  return /\b(test|qa probe)\b/i.test(name) || /^zzz/i.test(name);
}

// "ad" only when the source says so. Blank or "unknown" stays not recorded, never assumed.
function sourceKind(source) {
  const text = cell(source);
  if (!text || /^unknown$/i.test(text)) return 'none';
  if (/^added by hand: (called|messaged) from an ad/i.test(text)) return 'ad';
  if (/facebook|instagram|\bmeta\b|\bfb\b|\big\b|fbclid|\bad_id=|\bcampaign_id=|utm_medium=paid/i.test(text)) return 'ad';
  return 'other';
}

function adIdFromSource(source) {
  const match = /\bad_id=(\d+)/.exec(cell(source));
  return match ? match[1] : '';
}

function hashText(text) {
  let a = 0xdeadbeef;
  let b = 0x41c6ce57;
  for (let i = 0; i < text.length; i += 1) {
    const code = text.charCodeAt(i);
    a = Math.imul(a ^ code, 2654435761);
    b = Math.imul(b ^ code, 1597334677);
  }
  a = Math.imul(a ^ (a >>> 16), 2246822507) ^ Math.imul(b ^ (b >>> 13), 3266489909);
  b = Math.imul(b ^ (b >>> 16), 2246822507) ^ Math.imul(a ^ (a >>> 13), 3266489909);
  return (4294967296 * (2097151 & b) + (a >>> 0)).toString(36);
}

function belongsTogether(group, record) {
  if (record.fields.leadId) {
    if (group.leadIds.has(record.fields.leadId)) return true;
    if (group.leadIds.size) return false; // Two different IDs are two different submissions.
  }
  const phone = digitsOnly(record.fields.phone);
  if (!phone || phone !== group.phone) return false;
  if (record.time === null || group.lastTime === null) return false;
  return Math.abs(record.time - group.lastTime) <= MERGE_WINDOW_MS;
}

// Turns the raw sheet values (header row first) into leads.
// The live automations can write one inquiry to two rows seconds apart, so those merge.
// The sheet itself is never changed. Writes go to the lead's primary row only.
function buildLeads(values = []) {
  const { columns, missing } = mapHeaders(values[0] || []);
  if (missing.length) return { missing, leads: [], columns };

  const records = [];
  values.slice(1).forEach((row, index) => {
    const fields = {};
    for (const field of Object.keys(FIELD_HEADERS)) {
      fields[field] = columns[field] === undefined ? '' : cell(row[columns[field]]);
    }
    if (Object.values(fields).some(Boolean)) {
      records.push({ rowNumber: index + 2, fields, time: parseTime(fields.timestamp) });
    }
  });

  const ordered = [...records].sort((x, y) => {
    if (x.time === null && y.time === null) return x.rowNumber - y.rowNumber;
    if (x.time === null) return 1;
    if (y.time === null) return -1;
    return x.time - y.time || x.rowNumber - y.rowNumber;
  });

  const groups = [];
  for (const record of ordered) {
    let group = groups.find((candidate) => belongsTogether(candidate, record));
    if (!group) {
      group = { rows: [], leadIds: new Set(), phone: digitsOnly(record.fields.phone), lastTime: record.time };
      groups.push(group);
    }
    group.rows.push(record);
    if (record.fields.leadId) group.leadIds.add(record.fields.leadId);
    if (record.time !== null) group.lastTime = record.time;
  }

  const leads = groups.map((group) => {
    const primary = group.rows.find((row) => row.fields.leadId) || group.rows[0];
    const merged = {};
    for (const field of Object.keys(FIELD_HEADERS)) {
      merged[field] = primary.fields[field]
        || group.rows.map((row) => row.fields[field]).find(Boolean)
        || '';
    }
    const key = primary.fields.leadId
      ? `id_${hashText(primary.fields.leadId)}`
      : `k_${hashText([primary.fields.timestamp, digitsOnly(primary.fields.phone), primary.fields.name].join('|'))}`;
    const emailInText = merged.email ? '' : (merged.transcript.match(/[\w.+-]+@[\w-]+\.[\w.-]*\w/) || [''])[0];
    return {
      ...merged,
      key,
      primaryRow: primary.rowNumber,
      mergedRows: group.rows.length,
      receivedAt: primary.time ?? group.rows.map((row) => row.time).find((t) => t !== null) ?? null,
      isTest: group.rows.some((row) => isTestRecord(row.fields)),
      sourceKind: sourceKind(merged.source),
      displayEmail: merged.email || emailInText,
    };
  });

  leads.sort((x, y) => (y.receivedAt ?? -Infinity) - (x.receivedAt ?? -Infinity));
  return { missing: [], leads, columns };
}

const needsFollowUp = (lead) => !lead.isTest && !lead.contactStatus && !lead.bookingStatus;

function stage(key, label, leads, recordedField, values) {
  const recorded = leads.filter((lead) => lead[recordedField]).length;
  return {
    key,
    label,
    count: recorded === 0 ? null : leads.filter((lead) => values.includes(lead[recordedField])).length,
    notRecorded: leads.length - recorded,
  };
}

function moneyTotal(leads, field) {
  const known = leads.map((lead) => toMoney(lead[field])).filter((value) => value !== null);
  return {
    total: known.length ? Math.round(known.reduce((sum, value) => sum + value, 0) * 100) / 100 : null,
    recorded: known.length,
  };
}

// Money still in play: a lead with an amount on it that is not paid off and not lost.
function isStillOpen(lead) {
  if (['Not a fit', 'Bad number'].includes(lead.contactStatus)) return false;
  if (lead.bookingStatus === 'Canceled') return false;
  if (['Canceled', 'No-show'].includes(lead.jobStatus)) return false;
  return !['Paid in full', 'Refunded'].includes(lead.paymentStatus);
}

// Tests never count. A stage with nothing recorded is null (shown as Unknown), not 0.
function summarize(allLeads = []) {
  const leads = allLeads.filter((lead) => !lead.isTest);
  return {
    total: leads.length,
    needsFollowUp: leads.filter(needsFollowUp).length,
    stages: [
      { key: 'inquiries', label: 'Inquiries', count: leads.length, notRecorded: 0 },
      stage('reached', 'Reached', leads, 'contactStatus', ['Reached', 'Qualified', 'Not a fit']),
      stage('qualified', 'Qualified', leads, 'contactStatus', ['Qualified']),
      stage('booked', 'Booked', leads, 'bookingStatus', ['Booked', 'Rescheduled']),
      stage('completed', 'Finished', leads, 'jobStatus', ['Completed']),
      stage('paid', 'Paid', leads, 'paymentStatus', ['Deposit paid', 'Paid in full']),
    ],
    potential: moneyTotal(leads.filter(isStillOpen), 'potentialMoney'),
    collected: moneyTotal(leads, 'collectedRevenue'),
    directCosts: moneyTotal(leads, 'directJobCosts'),
    otherCosts: moneyTotal(leads, 'otherCosts'),
  };
}

// Customers who phone or walk in never touch the form, so an owner can add them by hand.
const HAND_SOURCES = ['Called from an ad', 'Messaged from an ad', 'Referral', 'Walk-in', 'Other'];
const isAddedByHand = (lead) => /^manual-/.test(lead.leadId || '');

function validateNewLead(input) {
  const errors = [];
  const text = (value, max) => (typeof value === 'string' ? value : '')
    // eslint-disable-next-line no-control-regex
    .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g, '').trim().slice(0, max);
  const clean = {
    name: text(input?.name, 200),
    phone: text(input?.phone, 40),
    project: text(input?.project, 200),
    howFound: text(input?.howFound, 40),
    notes: text(input?.notes, NOTES_MAX),
  };
  if (!clean.name) errors.push('Enter their name.');
  const digits = clean.phone.replace(/\D/g, '');
  if (digits.length < 10 || digits.length > 15) errors.push('Enter their phone number.');
  if (!HAND_SOURCES.includes(clean.howFound)) errors.push('Choose how they found you.');
  return { clean, errors };
}

// Only outcome fields can ever change from the portal. Inquiry data stays as the customer gave it.
function validateChanges(changes) {
  const clean = {};
  const errors = [];
  if (!changes || typeof changes !== 'object' || Array.isArray(changes)) {
    return { clean, errors: ['Nothing to save.'] };
  }
  for (const [field, raw] of Object.entries(changes)) {
    if (!OUTCOME_FIELDS.includes(field)) {
      errors.push(`${field} cannot be changed here.`);
      continue;
    }
    const text = typeof raw === 'number' ? String(raw) : typeof raw === 'string' ? raw : null;
    if (text === null) {
      errors.push(`${field} is not valid.`);
    } else if (STATUS_OPTIONS[field]) {
      const value = text.trim();
      if (value && !STATUS_OPTIONS[field].includes(value)) errors.push(`${field} is not one of the choices.`);
      else clean[field] = value;
    } else if (MONEY_FIELDS.includes(field)) {
      const value = text.replace(/[$,\s]/g, '');
      if (value && !/^\d{1,9}(\.\d{1,2})?$/.test(value)) errors.push(`${field} must be a dollar amount.`);
      else clean[field] = value;
    } else {
      // eslint-disable-next-line no-control-regex
      const value = text.replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g, '').trim();
      if (value.length > NOTES_MAX) errors.push(`Notes must be under ${NOTES_MAX} characters.`);
      else clean[field] = value;
    }
  }
  if (!errors.length && !Object.keys(clean).length) errors.push('Nothing to save.');
  return { clean, errors };
}

    },
    ads: async (slug) => {
      await later();
      if (!SHEETS[slug]) return { connected: false };
      const { leads } = buildLeads(SHEETS[slug]);
      const real = leads.filter((lead) => !lead.isTest);
      const fromAds = real.filter((lead) => lead.sourceKind === 'ad');
      const sum = summarize(fromAds);
      const stage = (name) => sum.stages.find((item) => item.key === name);
      const spend = 86.4;
      return {
        connected: true,
        range: { key: 'launch', since: '2026-11-04', until: '2026-11-06' },
        totals: { spend, impressions: 8412, reach: 3120, clicks: 301, linkClicks: 214, landingPageViews: 176, metaLeads: fromAds.length, callTaps: 9 },
        forms: { total: real.length, fromAds: fromAds.length, otherSource: real.length - fromAds.length, addedByHand: real.filter(isAddedByHand).length },
        funnel: { booked: stage('booked').count, completed: stage('completed').count, paid: stage('paid').count, notRecorded: stage('paid').notRecorded },
        collected: sum.collected.total,
        potential: sum.potential.total,
        costs: { perLinkClick: 0.4, perForm: fromAds.length ? Math.round((spend / fromAds.length) * 100) / 100 : null, perPaidCustomer: stage('paid').count ? Math.round((spend / stage('paid').count) * 100) / 100 : null },
        backPerDollar: sum.collected.total === null ? null : Math.round((sum.collected.total / spend) * 100) / 100,
        ads: [{ adId: '2000000001', name: 'Sample Ad 3', spend: 71.2, impressions: 7000, reach: 2800, clicks: 260, linkClicks: 190, landingPageViews: 160, metaLeads: fromAds.length, callTaps: 8, forms: fromAds.length, booked: stage('booked').count, paid: stage('paid').count, collected: sum.collected.total, potential: sum.potential.total, costPerForm: null }],
        formsWithoutAdId: 0,
        alerts: [{ kind: 'overspend', text: "Today's ad spend is $11.40, over the $10 daily limit." }],
      };
    },
    update: async ({ business, key, changes }) => {
      await later();
      const { clean, errors } = validateChanges(changes);
      if (errors.length) throw fail(400, 'invalid', errors.join(' '));
      const sheet = SHEETS[business];
      const { leads, columns } = buildLeads(sheet);
      const lead = leads.find((item) => item.key === key);
      const updatedAt = new Date().toISOString();
      for (const [field, value] of Object.entries(clean)) sheet[lead.primaryRow - 1][columns[field]] = value;
      sheet[lead.primaryRow - 1][columns.crmUpdatedAt] = updatedAt;
      const after = buildLeads(sheet).leads;
      const { primaryRow, ...fresh } = after.find((item) => item.key === key);
      return { lead: fresh, summary: summarize(after), fetchedAt: updatedAt };
    },
  };
}());

// Forever Gold CRM front end. Plain ES modules with no build step.
// This file is public, so it holds no client names and no customer data. Everything comes from the Worker
// after sign-in. All sheet text is untrusted (it comes from callers and forms), so it is only ever
// placed with text nodes, never as HTML.


const API_BASE = 'https://forever-gold-crm.forevergoldai.workers.dev';
const SESSION_KEY = 'fg_crm_session';
const TIME_ZONE = 'America/Denver';
const HELP_PHONE = '(406) 698-6693';
// Live updates: an open dashboard checks for new customers and numbers on its own.
// It never redraws while someone is typing, saving, or has touched the page in the last QUIET_MS,
// and the lead and add-a-customer pages never redraw on their own at all.
const LIVE_EVERY_MS = 60_000;
const QUIET_MS = 20_000;

class ApiError extends Error {
  constructor(status, code, message, data = {}) {
    super(message);
    this.status = status;
    this.code = code;
    this.data = data;
  }
}

async function call(path, { method = 'GET', body, token } = {}) {
  let response;
  try {
    response = await fetch(`${API_BASE}${path}`, {
      method,
      headers: {
        ...(body ? { 'Content-Type': 'application/json' } : {}),
        ...(token ? { Authorization: `Bearer ${token}` } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch {
    throw new ApiError(0, 'offline', 'Could not reach the CRM. Check your connection and try again.');
  }
  let data = {};
  try {
    data = await response.json();
  } catch {
    data = {};
  }
  if (!response.ok) throw new ApiError(response.status, data.error || 'server_error', data.message || 'Something went wrong. Nothing was changed.', data);
  return data;
}

// Sessions: the token only, never customer data. A browser may refuse storage, so every touch is guarded.
function readStore(store) {
  try {
    return JSON.parse(window[store].getItem(SESSION_KEY) || 'null');
  } catch {
    return null;
  }
}
function getSession() {
  const session = readStore('localStorage') || readStore('sessionStorage') || state.memorySession || null;
  if (session && session.expiresAt && session.expiresAt * 1000 <= Date.now()) {
    clearSession();
    return null;
  }
  return session;
}
function saveSession(session, remember) {
  clearSession();
  state.memorySession = session;
  try {
    window[remember ? 'localStorage' : 'sessionStorage'].setItem(SESSION_KEY, JSON.stringify(session));
  } catch {
    // Storage blocked: the session lasts until this page closes.
  }
}
function clearSession() {
  state.memorySession = null;
  for (const store of ['localStorage', 'sessionStorage']) {
    try {
      window[store].removeItem(SESSION_KEY);
    } catch {
      // Nothing to clear.
    }
  }
}
function signOut() {
  clearSession();
  state.cache = {};
  state.siteCache = {};
  state.adsCache = {};
  state.drafts = {};
  state.teamData = null;
  state.prints = {};
  go('#/');
}

function h(tag, props = {}, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === 'class') el.className = value;
    else if (key.startsWith('on') && typeof value === 'function') el.addEventListener(key.slice(2).toLowerCase(), value);
    else if (key === 'value') {
      el.value = value;
      el.setAttribute('value', value);
    } else el.setAttribute(key, value === true ? '' : String(value));
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    el.append(child.nodeType ? child : document.createTextNode(String(child)));
  }
  return el;
}

function setBrand(name) {
  const slot = document.getElementById('brand-name');
  const label = name ? `Forever Gold CRM / ${name}` : 'Forever Gold CRM';
  if (slot) slot.textContent = label;
  document.title = label;
}
const appEl = () => document.getElementById('app');
function show(...nodes) {
  const app = appEl();
  app.replaceChildren(...nodes.flat().filter(Boolean));
  if (typeof window.scrollTo === 'function') window.scrollTo(0, 0);
  if (typeof app.focus === 'function') app.focus({ preventScroll: true });
}
// A live redraw: same page, same scroll spot, and focus stays where the person left it.
function showQuietly(...nodes) {
  const y = typeof window.scrollY === 'number' ? window.scrollY : 0;
  appEl().replaceChildren(...nodes.flat().filter(Boolean));
  if (y && typeof window.scrollTo === 'function') window.scrollTo(0, y);
}
function go(hash) {
  if (location.hash === hash) route();
  else location.hash = hash;
}

const fmtMoney = (value) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(value);
function fmtWhen(ms) {
  if (ms === null || ms === undefined) return 'No date recorded';
  return new Intl.DateTimeFormat('en-US', { timeZone: TIME_ZONE, dateStyle: 'medium', timeStyle: 'short' }).format(new Date(ms));
}
function fmtClock(ms) {
  return new Intl.DateTimeFormat('en-US', { timeZone: TIME_ZONE, hour: 'numeric', minute: '2-digit' }).format(new Date(ms));
}
// Speed to lead: how long an inquiry has sat with nobody recorded as contacting it.
// It counts from when the inquiry came in, so it is only as right as the Contact column.
function waitedFor(ms) {
  const minutes = Math.max(0, Math.floor((Date.now() - ms) / 60000));
  if (minutes < 1) return 'under 1 min';
  if (minutes < 60) return `${minutes} min`;
  const hours = Math.floor(minutes / 60);
  if (hours < 48) return `${hours} h`;
  return `${Math.floor(hours / 24)} days`;
}
function waitTier(ms) {
  const minutes = (Date.now() - ms) / 60000;
  if (minutes < 5) return 'fresh';
  return minutes < 60 ? 'warm' : 'late';
}
function fmtDay(text) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(text || '');
  if (!match) return text;
  return new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', dateStyle: 'medium' }).format(new Date(Date.UTC(+match[1], +match[2] - 1, +match[3])));
}
function fmtPhone(phone) {
  const digits = digitsOnly(phone);
  return digits.length === 10 ? `(${digits.slice(0, 3)}) ${digits.slice(3, 6)}-${digits.slice(6)}` : phone;
}
function telHref(phone) {
  const digits = digitsOnly(phone);
  if (digits.length === 10) return `tel:+1${digits}`;
  return digits.length > 10 && digits.length <= 15 ? `tel:+${digits}` : null;
}
const safeMail = (email) => (/^[^\s@<>"']+@[^\s@<>"']+\.[^\s@<>"']+$/.test(email || '') ? `mailto:${email}` : null);

function lightUpJourney(root) {
  const steps = [...root.querySelectorAll('.step')];
  const calm = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (calm || typeof window.IntersectionObserver !== 'function') {
    steps.forEach((step) => step.classList.add('on'));
    return;
  }
  const watcher = new window.IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (entry.isIntersecting) {
        entry.target.classList.add('on');
        watcher.unobserve(entry.target);
      }
    }
  }, { rootMargin: '0px 0px -20% 0px' });
  steps.forEach((step) => watcher.observe(step));
}

// The share of inquiries that reached a step. Shown only when every inquiry has that step recorded,

const VIEWS = [
  ['follow', 'Needs follow-up', needsFollowUp],
  ['all', 'All', () => true],
  ['booked', 'Booked', (lead) => ['Booked', 'Rescheduled'].includes(lead.bookingStatus)],
  ['paid', 'Paid', (lead) => ['Deposit paid', 'Paid in full'].includes(lead.paymentStatus)],
];

function filteredLeads(leads) {
  const { view, source, q, showTests } = state.filter;
  const test = VIEWS.find(([id]) => id === view)[2];
  const needle = q.trim().toLowerCase();
  const needleDigits = needle.replace(/\D/g, '');
  return leads.filter((lead) => {
    if (lead.isTest && !showTests) return false;
    if (!lead.isTest && !test(lead)) return false;
    if (source !== 'all' && lead.sourceKind !== source) return false;
    if (!needle) return true;
    if ([lead.name, lead.displayEmail, lead.project, lead.outcomeNotes].some((text) => (text || '').toLowerCase().includes(needle))) return true;
    return needleDigits.length >= 3 && digitsOnly(lead.phone).includes(needleDigits);
  });
}

function waitPill(lead) {
  if (lead.receivedAt === null || lead.receivedAt === undefined) return h('span', { class: 'pill todo' }, 'Needs follow-up');
  return h('span', { class: `pill wait ${waitTier(lead.receivedAt)}`, 'data-since': String(lead.receivedAt) }, `Waiting ${waitedFor(lead.receivedAt)}`);
}

// Live ticks keep every waiting time current without redrawing the page.
function refreshWaitTimes() {
  for (const pill of document.querySelectorAll('.pill.wait[data-since]')) {
    const since = Number(pill.getAttribute('data-since'));
    pill.textContent = `Waiting ${waitedFor(since)}`;
    pill.className = `pill wait ${waitTier(since)}`;
  }
  for (const slot of document.querySelectorAll('.wait-text[data-since]')) slot.textContent = waitedFor(Number(slot.getAttribute('data-since')));
}

// The one thing to do next: call whoever has waited longest. Nothing here is a guess; it reads the Contact column.
function callNext(slug, data) {
  const waiting = data.leads.filter(needsFollowUp);
  if (!data.leads.some((lead) => !lead.isTest)) return null;
  if (!waiting.length) {
    return h('section', { class: 'next-up clear', 'aria-label': 'Who to call next' },
      h('div', { class: 'next-copy' },
        h('h2', {}, 'No one is waiting on a call'),
        h('p', {}, 'Every inquiry on your records has a contact or booking recorded.')));
  }
  const dated = waiting.filter((lead) => lead.receivedAt !== null && lead.receivedAt !== undefined).sort((a, b) => a.receivedAt - b.receivedAt);
  const first = dated[0] || waiting[0];
  const name = first.name || 'No name recorded';
  const tel = telHref(first.phone);
  const n = waiting.length;
  return h('section', { class: 'next-up', 'aria-label': 'Who to call next' },
    h('div', { class: 'next-copy' },
      h('h2', {}, `${count(n)} ${n === 1 ? 'person is' : 'people are'} waiting on a call`),
      dated.length
        ? h('p', {}, 'Longest wait: ', h('strong', {}, name), ', ', h('span', { class: 'wait-text', 'data-since': String(first.receivedAt) }, waitedFor(first.receivedAt)), '.')
        : h('p', {}, 'Next up: ', h('strong', {}, name), '.')),
    h('div', { class: 'next-actions' },
      tel && h('a', { class: 'btn btn-gold', href: tel, 'aria-label': `Call ${name} at ${fmtPhone(first.phone)}` }, 'Call now'),
      h('a', { class: 'btn', href: `#/b/${encodeURIComponent(slug)}/lead/${encodeURIComponent(first.key)}` }, 'Open')));
}

}

// One tap: yes means Reached, no clears it. It only changes once the server confirms the save.
async function saveContacted(slug, data, lead, box) {
  const session = getSession();
  box.disabled = true;
  state.saving += 1;
  try {
    const result = await api().update({ business: slug, key: lead.key, changes: { contactStatus: box.checked ? 'Reached' : '' }, expectedUpdatedAt: lead.crmUpdatedAt }, session.token);
    const index = data.leads.findIndex((item) => item.key === lead.key);
    if (index >= 0) data.leads[index] = result.lead;
    data.summary = result.summary;
    data.fetchedAt = result.fetchedAt;
    route();
  } catch (error) {
    if (handleSignedOut(error, slug)) return;
    box.checked = !box.checked;
    box.disabled = false;
    const card = box.closest('.lead');
    if (card) card.append(h('p', { class: 'message', role: 'alert' }, error.message));
  } finally {
    state.saving -= 1;
  }
}

function renderList(container, slug, data) {
  const shown = filteredLeads(data.leads);
  const labels = data.business.labels || {};
  if (shown.length) {
    container.replaceChildren(h('ul', { class: 'leads', 'aria-label': `${shown.length} leads` }, shown.map((lead) => leadCard(slug, lead, labels, (item, box) => saveContacted(slug, data, item, box)))));
    return;
  }
  const words = data.leads.some((lead) => !lead.isTest)
    ? 'Nothing matches this view. Try All.'
    : 'No inquiries on your records yet. New ones show up here when you refresh.';
  container.replaceChildren(h('p', { class: 'empty' }, words));
}

// ---------- Ad numbers ----------
const AD_RANGES = [['launch', 'Since launch'], ['7d', 'Last 7 days'], ['today', 'Today']];
const count = (value) => new Intl.NumberFormat('en-US').format(value);
const moneyOr = (value, fallback) => (value === null || value === undefined ? fallback : fmtMoney(value));

function adCard(ad) {
  return h('li', { class: 'ad-card' },
    h('h3', {}, ad.name),
    h('dl', { class: 'ad-facts' },
      h('div', {}, h('dt', {}, 'Spent'), h('dd', {}, fmtMoney(ad.spend))),
      h('div', {}, h('dt', {}, 'Link clicks'), h('dd', {}, count(ad.linkClicks))),
      h('div', {}, h('dt', {}, 'Page views'), h('dd', {}, count(ad.landingPageViews))),
      h('div', {}, h('dt', {}, 'Inquiries'), h('dd', {}, count(ad.forms))),
      h('div', {}, h('dt', {}, 'Booked'), h('dd', {}, ad.booked === null ? 'Unknown' : count(ad.booked))),
      h('div', {}, h('dt', {}, 'Paid'), h('dd', {}, ad.paid === null ? 'Unknown' : count(ad.paid))),
      h('div', {}, h('dt', {}, 'Potential'), h('dd', {}, moneyOr(ad.potential, 'Unknown'))),
      h('div', {}, h('dt', {}, 'Collected'), h('dd', {}, moneyOr(ad.collected, 'Unknown')))));
}

// The whole story in one line: dollars in, customers, dollars back. Meta knows the first two links,
// only the owner's records know the rest, so an unrecorded link says Unknown instead of zero.
function moneyChain(board) {
  const { totals, forms, funnel } = board;
  const known = (value, show) => (value === null || value === undefined ? 'Unknown' : show(value));
  const links = [
    ['Ad spend', fmtMoney(totals.spend), 'meta'],
    ['Link clicks', count(totals.linkClicks), 'meta'],
    ['Inquiries from ads', count(forms.fromAds), 'records'],
    ['Booked', known(funnel.booked, count), 'records'],
    ['Paying', known(funnel.paid, count), 'records'],
    ['Collected', known(board.collected, fmtMoney), 'records'],
  ];
  return h('div', { class: 'chain-wrap' },
    h('ol', { class: 'chain', 'aria-label': 'From ad dollars to money collected' },
      links.map(([label, value, from]) => h('li', { class: `chain-link ${from}${value === 'Unknown' ? ' unknown' : ''}` },
        h('span', { class: 'chain-label' }, label),
        h('strong', { class: 'chain-value' }, value)))),
    h('p', { class: 'chain-verdict' }, board.backPerDollar === null || board.backPerDollar === undefined
      ? 'Money back per $1 shows once a payment is recorded on a lead from an ad.'
      : `${fmtMoney(board.backPerDollar)} back for every $1 of ads.`));
}

const PIXEL_LABELS = { PageView: 'Pages opened', CallIntent: 'Call taps, all visitors', Lead: 'Inquiries sent', Contact: 'Contact taps' };
const PIXEL_NOTES = { CallIntent: 'A tap, not a finished call' };

// The website pixel counts every visitor, not only ad clicks. Event names come from Meta, so they are text only.
function pixelBlock(pixel) {
  const title = h('h3', { class: 'board-title' }, 'From your website pixel');
  if (pixel.error) {
    return [title, h('p', { class: 'note' }, `The pixel counts could not load right now. This does not mean zero.${pixel.detail ? ` (${pixel.detail})` : ''}`)];
  }
  const names = Object.keys(pixel.events).sort((a, b) => pixel.events[b] - pixel.events[a]);
  return [
    title,
    names.length
      ? h('dl', { class: 'stats' }, names.map((name) => statBox(PIXEL_LABELS[name] || name, count(pixel.events[name]), PIXEL_NOTES[name] || null)))
      : h('p', { class: 'note' }, 'Meta reports no pixel events in these dates.'),
    h('p', { class: 'note' }, `Pixel ${pixel.datasetId}. It counts everyone on the website, not only people who came from an ad.${pixel.partial ? ' Very busy dates may show a little low.' : ''}`),
  ];
}

function adsBoard(board) {
  const { totals, forms, funnel, costs } = board;
  const fromYourRecords = funnel.notRecorded ? `${funnel.notRecorded} not recorded` : null;
  return [
    (board.alerts || []).length > 0 && h('ul', { class: 'alerts', 'aria-label': 'Alerts' }, board.alerts.map((alert) => h('li', { class: 'message' }, alert.text))),
    moneyChain(board),
    h('h3', { class: 'board-title' }, 'From Meta'),
    h('dl', { class: 'stats' },
      statBox('Ad spend', fmtMoney(totals.spend)),
      statBox('Times shown', count(totals.impressions)),
      statBox('Reach', count(totals.reach)),
      statBox('Link clicks', count(totals.linkClicks), moneyOr(costs.perLinkClick, null) && `${fmtMoney(costs.perLinkClick)} per click`),
      statBox('Page views', count(totals.landingPageViews)),
      statBox('Call button taps', count(totals.callTaps), 'A tap, not a finished call')),
    ...(board.pixel ? pixelBlock(board.pixel) : []),
    h('h3', { class: 'board-title' }, 'From your records'),
    h('dl', { class: 'stats' },
      statBox('Inquiries in these dates', count(forms.total), `${count(forms.fromAds)} from ads, ${count(forms.otherSource)} other${forms.addedByHand ? `, ${count(forms.addedByHand)} added by hand` : ''}`),
      statBox('Cost per ad inquiry', moneyOr(costs.perForm, 'None yet')),
      statBox('Booked from ads', funnel.booked === null ? null : count(funnel.booked), fromYourRecords),
      statBox('Paying from ads', funnel.paid === null ? null : count(funnel.paid), fromYourRecords),
      statBox('Cost per paying customer', costs.perPaidCustomer === null ? null : fmtMoney(costs.perPaidCustomer)),
      statBox('Potential money from ads', moneyOr(board.potential, null)),
      statBox('Collected from ads', moneyOr(board.collected, null), board.backPerDollar === null ? null : `${fmtMoney(board.backPerDollar)} back per $1 of ads`)),
    board.formsWithoutAdId > 0 && h('p', { class: 'note' }, `${board.formsWithoutAdId} came from an ad but do not say which one, so they are not in the ad by ad list.`),
    board.ads.length > 0 && h('h3', { class: 'board-title' }, 'Ad by ad'),
    board.ads.length > 0 && h('ul', { class: 'ad-list' }, board.ads.map(adCard)),
    h('p', { class: 'note' }, 'Spend and clicks come from Meta and can lag by a few minutes. Paying customers only count once someone marks the payment on a lead.'),
  ];
}

function adsPanel(slug, token, onNames) {
  const body = h('div', { 'aria-live': 'polite' });
  const panel = h('section', { class: 'ads-panel', 'aria-labelledby': 'ads-title' }, h('h2', { id: 'ads-title' }, 'Your ads'));
  const chips = h('div', { class: 'filters', role: 'group', 'aria-label': 'Which dates to show' });
  // fresh: a person asked (tapped a range), so Meta is asked again. Otherwise a board under half a live tick old is reused.
  const load = async (fresh) => {
    chips.replaceChildren(...AD_RANGES.map(([id, label]) => h('button', {
      class: 'chip',
      type: 'button',
      'aria-pressed': String(state.adsRange === id),
      onClick: () => {
        state.adsRange = id;
        load(true);
      },
    }, label)));
    const asked = state.adsRange;
    const key = `${slug}:${asked}`;
    const paint = (board) => {
      if (!board.connected) {
        panel.replaceChildren(panel.firstChild, h('p', { class: 'note' }, 'Ad numbers are not connected yet. This does not mean your ads have no results.'));
        return;
      }
      for (const ad of board.ads) state.adNames[ad.adId] = ad.name;
      onNames();
      body.replaceChildren(...adsBoard(board).filter(Boolean));
    };
    // A live redraw paints the board it just fetched instead of flashing a loading line.
    const cached = state.adsCache[key];
    if (cached) paint(cached.board);
    else body.replaceChildren(h('p', { class: 'note' }, 'Loading your ad numbers...'));
    if (!fresh && cached && Date.now() - cached.at < LIVE_EVERY_MS / 2) return;
    try {
      const board = await api().ads(slug, asked, token);
      if (asked !== state.adsRange) return;
      state.adsCache[key] = { board, at: Date.now() };
      paint(board);
    } catch (error) {
      if (asked !== state.adsRange) return;
      body.replaceChildren(h('p', { class: 'message', role: 'alert' }, error.message));
    }
  };
  panel.append(chips, body);
  load(false);
  return panel;
}

// ---------- Website numbers ----------
const SITE_RANGES = [['today', 'Today'], ['7d', 'Last 7 days'], ['month', 'Whole month'], ['all', 'Entire time']];

function syncMark() {
  return h('span', { class: 'sync-mark', role: 'status', 'aria-label': 'Syncing' });
}

function waitingSite() {
  return [
    h('p', { class: 'note sync-line' }, syncMark(), ' Syncing with your website.'),
    h('dl', { class: 'stats' },
      statBox('Viewed', syncMark(), 'People who opened the site'),
      statBox('Started a form', syncMark(), 'Filled in, then left without submit'),
      statBox('Hit submit', syncMark(), 'The tap. It still has to reach the owner.'),
      statBox('Call button', syncMark(), 'A tap. This does not show whether the owner answered.')),
    h('h3', { class: 'board-title' }, 'Where people clicked'),
    h('p', { class: 'note sync-line' }, syncMark(), ' Syncing'),
    h('h3', { class: 'board-title' }, 'From the form'),
    h('p', { class: 'note sync-line' }, syncMark(), ' Syncing'),
  ];
}

function siteKey(slug, range) {
  return `${slug}:${range}`;
}

function clearAds(slug) {
  for (const key of Object.keys(state.adsCache)) {
    if (key.startsWith(`${slug}:`)) delete state.adsCache[key];
  }
}

function clearSite(slug) {
  for (const key of Object.keys(state.siteCache)) {
    if (key.startsWith(`${slug}:`)) delete state.siteCache[key];
  }
}

function requestSite(slug, token, range, fresh) {
  const key = siteKey(slug, range || state.siteRange);
  if (fresh) delete state.siteCache[key];
  const hit = state.siteCache[key];
  if (hit?.board) return Promise.resolve(hit.board);
  if (hit?.promise) return hit.promise;
  const promise = api().site(slug, range || state.siteRange, token).then((board) => {
    state.siteCache[key] = { board };
    return board;
  }).catch((error) => {
    if (state.siteCache[key]?.promise === promise) delete state.siteCache[key];
    throw error;
  });
  state.siteCache[key] = { promise };
  return promise;
}

function dialHref(phone) {
  const digits = String(phone || '').replace(/[^\d+]/g, '');
  return digits ? `tel:${digits}` : '';
}

// ---------- Where people clicked ----------
const TAP_KIND = { click: 'Tap', call: 'Call', email: 'Email', text: 'Text', outbound: 'Outside link' };
const pageName = (path) => (path === '/' ? 'Home' : path);

function trackerNote(tracker) {
  if (tracker?.version === 2) {
    return h('p', { class: 'note' }, `Every button and link counted since ${tracker.since ? fmtDay(tracker.since) : 'the new counter started'}. Before that, only menu links, section links, tabs and Call taps were counted.`);
  }
  return h('p', { class: 'note' }, 'This site still runs the first counter: menu links, section links, tabs and Call taps. Every other button is counted once it gets the new counter.');
}

function tapRow(tap, most) {
  const name = tap.kind === 'outbound' ? `${tap.spot || 'Link'} (${tap.label})` : (tap.label || 'Link');
  const where = tap.opens ? `Opens ${pageName(tap.page)}` : [pageName(tap.page), tap.kind === 'outbound' ? '' : tap.spot].filter(Boolean).join(' · ');
  const row = h('li', { class: `tap-row kind-${tap.kind}` },
    h('span', { class: 'tap-name' }, name),
    h('span', { class: 'tap-where' }, `${TAP_KIND[tap.kind] || 'Tap'} · ${where}`),
    h('strong', { class: 'tap-count' }, count(tap.hits)),
    h('span', { class: 'tap-bar', 'aria-hidden': 'true' }));
  // A bar for size at a glance. Set through the style object, which the page's security policy allows.
  const share = most ? Math.max(3, Math.round((tap.hits / most) * 100)) : 0;
  if (row.style && typeof row.style.setProperty === 'function') row.style.setProperty('--share', `${share}%`);
  return row;
}

function tapList(board) {
  const taps = Array.isArray(board.taps) ? board.taps : [];
  if (!taps.length) return h('p', { class: 'note' }, 'No taps in this range.');
  const most = taps[0].hits || 1;
  const top = taps.slice(0, 10);
  return h('div', { class: 'taps' },
    h('ol', { class: 'tap-list', 'aria-label': 'Most tapped' }, top.map((tap) => tapRow(tap, most))),
    taps.length > top.length && h('details', { class: 'taps-all' },
      h('summary', {}, `Show every tap (${count(board.tapsTotal || taps.length)})`),
      h('ol', { class: 'tap-list' }, taps.map((tap) => tapRow(tap, most))),
      (board.tapsTotal || 0) > taps.length && h('p', { class: 'note' }, `Showing the ${count(taps.length)} most tapped.`)));
}

function siteBoard(board) {
  const rangeNote = board.range?.key === 'all'
    ? 'Entire time starts the day counting began on this site. Earlier visits are not here.'
    : (board.range?.key === 'month' ? 'This calendar month, Denver time.' : '');
  const contacts = Array.isArray(board.contacts) ? board.contacts : [];
  const full = board.tracker?.version === 2;
  return [
    rangeNote && h('p', { class: 'note' }, rangeNote),
    h('dl', { class: 'stats' },
      statBox('Viewed', count(board.people), 'People who opened the site'),
      statBox('Started a form', count(board.formStarts), 'Filled in, then left without submit'),
      statBox('Hit submit', count(board.forms), 'The tap. It still has to reach the owner.'),
      statBox('Call button', count(board.calls), 'A tap. This does not show whether the owner answered.')),
    // Before the every-button counter, emails, texts and outside links were never counted: Unknown, not zero.
    h('dl', { class: 'stats taps-more' },
      statBox('Email taps', full ? count(board.emails || 0) : null, 'Opens their email app'),
      statBox('Text taps', full ? count(board.texts || 0) : null, 'Opens their messages'),
      statBox('Outside links', full ? count(board.outbound || 0) : null, 'Left for another site')),
    h('h3', { class: 'board-title' }, 'Where people clicked'),
    trackerNote(board.tracker),
    tapList(board),
    board.depth && h('h3', { class: 'board-title' }, 'How far people read'),
    board.depth && h('dl', { class: 'stats depth' },
      statBox('Saw a quarter', count(board.depth['25%'] || 0)),
      statBox('Saw half', count(board.depth['50%'] || 0)),
      statBox('Saw three quarters', count(board.depth['75%'] || 0)),
      statBox('Reached the bottom', count(board.depth['100%'] || 0))),
    board.depth && h('p', { class: 'note' }, 'Page views that got that far, counted since every-button counting began.'),
    h('h3', { class: 'board-title' }, 'From the form'),
    contacts.length === 0
      ? h('p', { class: 'note' }, 'No one has hit submit in this range.')
      : h('ul', { class: 'ad-list' }, contacts.map((person) => h('li', { class: 'ad-card site-contact' },
        h('h3', {}, person.name || 'Name not given'),
        person.phone
          ? h('p', {}, h('a', { href: dialHref(person.phone) }, person.phone))
          : h('p', { class: 'note' }, 'No phone'),
        person.email
          ? h('p', {}, h('a', { href: `mailto:${person.email}` }, person.email))
          : h('p', { class: 'note' }, 'No email')))),
  ];
}

function sitePanel(slug, token) {
  const body = h('div', { 'aria-live': 'polite' });
  const panel = h('section', { class: 'site-panel', 'aria-labelledby': 'site-title' }, h('h2', { id: 'site-title' }, 'Your website'));
  const chips = h('div', { class: 'filters', role: 'group', 'aria-label': 'Which website dates to show' });
  const paint = (board) => {
    const when = Date.parse(board?.fetchedAt || '') || Date.now();
    const waiting = !board || !board.collecting || !board.seen;
    const stamp = h('p', { class: 'fetched' }, `${waiting ? 'Checked' : 'Counted'} ${fmtWhen(when)}`);
    body.replaceChildren(stamp, ...(waiting ? waitingSite() : siteBoard(board)).filter(Boolean));
  };
  const load = async (fresh) => {
    if (typeof api().site !== 'function') {
      paint(null);
      return;
    }
    chips.replaceChildren(...SITE_RANGES.map(([id, label]) => h('button', {
      class: 'chip',
      type: 'button',
      'aria-pressed': String(state.siteRange === id),
      onClick: () => {
        state.siteRange = id;
        load(true);
      },
    }, label)));
    const asked = state.siteRange;
    const ready = !fresh && state.siteCache[siteKey(slug, asked)]?.board;
    if (ready) paint(ready);
    else body.replaceChildren(...waitingSite());
    try {
      const board = await requestSite(slug, token, asked, fresh);
      if (asked !== state.siteRange) return;
      paint(board);
    } catch (error) {
      if (asked !== state.siteRange) return;
      body.replaceChildren(...waitingSite(), h('p', { class: 'message', role: 'alert' }, error.message));
    }
  };
  panel.append(chips, body);
  load(false);
  return panel;
}

function websiteLine(site) {
  if (!site) return '';
  if (!site.collecting || !site.seen) return 'Syncing with the website.';
  return `Last 7 days: ${count(site.people)} people, ${count(site.formStarts)} started a form, ${count(site.forms)} submitted, ${count(site.calls)} call taps.`;
}

  const chips = VIEWS.map(([id, label, test]) => {

      class: 'chip',
      type: 'button',
      'aria-pressed': String(state.filter.view === id),
      onClick: (event) => {
        state.filter.view = id;
        event.currentTarget.parentElement.querySelectorAll('.chip').forEach((chip) => chip.setAttribute('aria-pressed', String(chip === event.currentTarget)));

      h('h1', {}, data.business.name),

      livePill(data.fetchedAt)),

      session?.isTeam && h('a', { class: 'btn', href: '#/team' }, 'All businesses'),
      h('button', {
        class: 'btn',
        type: 'button',
        onClick: () => {
          delete state.cache[slug];
          clearSite(slug);
          clearAds(slug);

      }, 'Refresh'),
      h('button', { class: 'text-btn', type: 'button', onClick: signOut }, 'Sign out')));

  const customers = h('section', { class: 'panel customers-panel', 'aria-labelledby': 'customers-title' },
    h('h2', { id: 'customers-title' }, 'Your customers'),

    h('div', { class: 'filters', role: 'group', 'aria-label': 'Which leads to show' }, chips),
    h('div', { class: 'search-row' },
      h('label', { for: 'search' }, 'Search',
        h('input', {
          id: 'search',
          type: 'search',
          value: state.filter.q,

    listArea);
  // Reading order (Thomas, 2026-11-11): who to call, the live website numbers back on top where they were,

  const page = h('div', { class: 'page wrap' },

// Says the page keeps itself current. The dot is still on purpose: this is the working tool.

async function loadBusinessData(slug, ticket) {
  const session = getSession();
  if (!session || !(session.isTeam || session.slug === slug)) {
    go(`#/sign-in/${encodeURIComponent(slug)}`);
    return null;
  }
  const siteJob = requestSite(slug, session.token, state.siteRange).catch(() => null);
  const siteReady = Promise.race([
    siteJob,
    new Promise((resolve) => {
      const timer = setTimeout(resolve, 4000);
      if (timer && typeof timer.unref === 'function') timer.unref();
    }),
  ]);
  if (state.cache[slug]) {
    await siteReady;
    return state.cache[slug];
  }
  show(h('p', { class: 'wrap note' }, 'Loading your records...'));
  try {
    const data = await api().leads(slug, session.token);
    await siteReady;
    if (ticket !== state.ticket) return null;
    state.cache[slug] = data;
    return data;
  } catch (error) {
    if (ticket !== state.ticket) return null;
    if (!handleSignedOut(error, slug)) show(errorBox(error, route));
    return null;
  }
}

async function renderBusiness(slug, ticket) {
